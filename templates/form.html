<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="data:,">
    <title>Serving Configuration Portal</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { background: #f4f6f8; color: #18212b; margin: 0; }
      main { background: #fff; margin: 4rem auto; max-width: 42rem; padding: 2rem; }
      h1 { margin-top: 0; }
      .lede, .warning { line-height: 1.5; }
      .warning { background: #fff4d6; border-left: 4px solid #d28a00; padding: .75rem 1rem; }
      form { display: grid; gap: 1rem; margin-top: 1.5rem; }
      label { display: grid; gap: .35rem; font-weight: 600; }
      input { border: 1px solid #9aa7b2; border-radius: .25rem; font: inherit; padding: .6rem; }
      button { background: #1459a6; border: 0; border-radius: .25rem; color: #fff; cursor: pointer; font: inherit; padding: .7rem 1rem; }
      button:disabled { cursor: wait; opacity: .7; }
      #submit-status { min-height: 1.5rem; }
      #submit-status[data-state="error"] { color: #a12622; }
      #submit-status[data-state="completed"] { color: #176b38; }
    </style>
  </head>
  <body>
    <main>
      <h1>Serving Configuration Portal</h1>
      <p class="lede">Submit serving constraints and receive AIConfigurator performance estimates.</p>
      <p class="warning"><strong>Estimate warning:</strong> predictions must be validated with representative real benchmarks before deployment.</p>

      <form id="run-form" data-endpoint="/api/runs">
        <label for="model">Model
          <input id="model" name="model" type="text" value="{{ defaults.model }}" required>
        </label>
        <label for="system">GPU system
          <input id="system" name="system" type="text" value="{{ defaults.system }}" required>
        </label>
        <label for="total-gpus">Total GPUs
          <input id="total-gpus" name="total_gpus" type="number" min="1" step="1" value="{{ defaults.total_gpus }}" required>
        </label>
        <label for="ttft">TTFT target (ms)
          <input id="ttft" name="ttft" type="number" min="0.001" step="any" value="{{ defaults.ttft }}" required>
        </label>
        <label for="tpot">TPOT target (ms)
          <input id="tpot" name="tpot" type="number" min="0.001" step="any" value="{{ defaults.tpot }}" required>
        </label>
        <button type="submit">Submit configuration run</button>
        <p id="submit-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <script>
      const form = document.querySelector("#run-form");
      const status = document.querySelector("#submit-status");
      const submitButton = form.querySelector("button");
      const POLL_INTERVAL_MS = 2000;
      let pollTimer = null;
      let pollGeneration = 0;

      function setStatus(message, state, busy) {
        status.textContent = message;
        status.dataset.state = state;
        status.setAttribute("aria-busy", String(busy));
      }

      function cancelPolling() {
        if (pollTimer !== null) {
          window.clearTimeout(pollTimer);
          pollTimer = null;
        }
        pollGeneration += 1;
      }

      async function pollRun(runId, generation) {
        if (generation !== pollGeneration) {
          return;
        }

        try {
          const response = await fetch(`/api/runs/${encodeURIComponent(runId)}`);
          let body;
          try {
            body = await response.json();
          } catch {
            throw new Error("The server returned an invalid status response.");
          }
          if (!response.ok) {
            throw new Error(body.detail || "The run status could not be loaded.");
          }
          if (generation !== pollGeneration) {
            return;
          }

          if (body.status === "queued" || body.status === "running") {
            setStatus(`Run ${runId} is ${body.status}.`, "loading", true);
            pollTimer = window.setTimeout(
              () => pollRun(runId, generation),
              POLL_INTERVAL_MS
            );
            return;
          }
          if (body.status === "completed") {
            setStatus(`Run ${runId} completed. Results are ready.`, "completed", false);
            submitButton.disabled = false;
            return;
          }
          if (body.status === "failed") {
            setStatus(
              `Run ${runId} failed: ${body.error || "unknown error"}`,
              "error",
              false
            );
            submitButton.disabled = false;
            return;
          }
          throw new Error("The run returned an unknown status.");
        } catch (error) {
          if (generation !== pollGeneration) {
            return;
          }
          setStatus(error.message, "error", false);
          submitButton.disabled = false;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        cancelPolling();
        const values = Object.fromEntries(new FormData(form));
        values.total_gpus = Number(values.total_gpus);
        values.ttft = Number(values.ttft);
        values.tpot = Number(values.tpot);
        submitButton.disabled = true;
        setStatus("Submitting run…", "loading", true);

        try {
          const response = await fetch(form.dataset.endpoint, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify(values)
          });
          const body = await response.json();
          if (!response.ok) {
            throw new Error(body.detail || "The run could not be submitted.");
          }
          setStatus(`Run ${body.id} is ${body.status}.`, "loading", true);
          const generation = pollGeneration;
          pollRun(body.id, generation);
        } catch (error) {
          submitButton.disabled = false;
          setStatus(error.message, "error", false);
        }
      });
    </script>
  </body>
</html>
